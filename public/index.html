<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agentkolonin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="scanlines"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>Agentkolonin</h1>
  </div>
  <div class="goal-wrap">
    <div class="goal-label">
      <span>Dagens mål</span>
      <span id="goal-amount">0,00 kr / 200,00 kr</span>
    </div>
    <div class="goal-bar"><div class="goal-fill" id="goal-fill"></div></div>
  </div>
  <a id="payment-link" class="btn btn-primary payment-btn" href="#" target="_blank" rel="noopener" style="display:none;">💳 Betala</a>
</header>

<main class="layout">

  <section class="colony-panel">
    <div class="panel-head">
      <h2>Kolonin <span class="count-pill" id="agent-count">0 / 20</span></h2>
      <div class="panel-actions">
        <button class="btn btn-primary" id="spawn-text">+ Ny textagent</button>
        <button class="btn btn-ghost" id="spawn-image">+ Ny bildagent</button>
      </div>
    </div>
    <svg id="lineage-lines" class="lineage-lines"></svg>
    <div id="agent-grid" class="agent-grid"></div>
  </section>

  <aside class="side-panel">
    <div class="log-card">
      <h2>Aktivitetslogg</h2>
      <div id="log-feed" class="log-feed"></div>
    </div>
  </aside>

</main>

<template id="agent-card-template">
  <article class="agent-card" data-status="idle">
    <div class="agent-card-head">
      <span class="agent-avatar"></span>
      <div class="agent-title">
        <h3 class="agent-name"></h3>
        <span class="agent-status"></span>
      </div>
      <button class="btn-info" title="Om agenten" aria-label="Om agenten">i</button>
    </div>
    <div class="agent-body">
      <div class="agent-latest">
        <span class="latest-label">Senaste alster <span class="latest-hint">(klicka för hela historiken)</span></span>
        <p class="latest-title"></p>
        <p class="latest-preview"></p>
      </div>
      <div class="agent-meta">
        <div class="meta-item">
          <span class="meta-value output-count">0</span>
          <span class="meta-label">alster</span>
        </div>
        <div class="meta-item">
          <span class="meta-value earnings">0,00 kr</span>
          <span class="meta-label">intjänat</span>
        </div>
      </div>
    </div>
    <div class="agent-actions">
      <button class="btn btn-tiny btn-reproduce">Föröka</button>
      <button class="btn btn-tiny btn-sale">Logga försäljning</button>
      <button class="btn btn-tiny btn-stop">Stoppa</button>
    </div>
  </article>
</template>

<div id="sale-dialog" class="modal-overlay">
  <div class="modal-box">
    <form id="sale-form">
      <div class="modal-head">
        <h3>Logga försäljning</h3>
        <button type="button" class="modal-x" data-close-modal="sale-dialog" aria-label="Stäng">✕</button>
      </div>
      <p class="dialog-sub">Registrera manuellt när du sålt agentens material någonstans.</p>
      <label>
        Belopp (kr)
        <input type="number" min="1" step="0.01" id="sale-amount" required />
      </label>
      <label>
        Beskrivning
        <input type="text" id="sale-description" placeholder="t.ex. sålt på Etsy" />
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-modal="sale-dialog">Avbryt</button>
        <button type="submit" class="btn btn-primary">Spara</button>
      </div>
    </form>
  </div>
</div>

<div id="outputs-dialog" class="modal-overlay">
  <div class="modal-box outputs-box">
    <div class="outputs-dialog-head">
      <h3 id="outputs-dialog-title">Alster</h3>
      <div class="outputs-dialog-actions">
        <button type="button" class="btn btn-ghost btn-tiny" id="outputs-download-all">Ladda ner alla</button>
        <button type="button" class="modal-x" data-close-modal="outputs-dialog" aria-label="Stäng">✕</button>
      </div>
    </div>
    <div id="outputs-list" class="outputs-list"></div>
  </div>
</div>

<div id="bio-dialog" class="modal-overlay">
  <div class="modal-box">
    <div class="outputs-dialog-head">
      <h3 id="bio-dialog-title">Om agenten</h3>
      <button type="button" class="modal-x" data-close-modal="bio-dialog" aria-label="Stäng">✕</button>
    </div>
    <div id="bio-content" class="bio-content"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
